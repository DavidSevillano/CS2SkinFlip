name: Deploy SEO web

on:
  schedule:
    # Daily at 04:00 UTC, after the backend's 2-hourly bulk price refresh has settled.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: web
        run: ./gradlew build --no-daemon

      - name: Generate the static site
        working-directory: web
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          # Absolute: `gradlew run` uses the module dir as CWD, so a relative
          # OUT_DIR would land in web/generator/dist instead of web/dist.
          OUT_DIR: ${{ github.workspace }}/web/dist
        run: ./gradlew :generator:run --no-daemon

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=cs2skinflip-web
