services:
  - type: web
    name: cs2skinflip-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json
      # Reverse-proxy hops in front of this service, so rate limiting keys on the
      # caller instead of the proxy. Measured 2026-07-16 via GET /debug/client-ip:
      # the socket is a container-local proxy (127.0.0.1) and X-Forwarded-For is
      # [client, Cloudflare edge, Render LB] — three trusted hops, stable across
      # samples. Must be this count and not `true`; see config/trustProxy.ts.
      # Re-measure with /debug/client-ip if Render ever changes its topology:
      # a wrong count degrades to coarser buckets rather than failing loudly.
      - key: TRUST_PROXY
        value: 3
