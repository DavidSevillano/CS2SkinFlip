services:
  - type: web
    name: cs2skinflip-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FCM_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json
